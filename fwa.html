the best there is","head2":"FWA is where you go to experience cutting-edge innovation in digital design and development. It\u2019s a space that encourages the digital industry to push the boundaries of technology, to show people what is possible.","introHead":"FWA welcomes  <br \/>\nsubmissions for:","intro":"**AI** (submit a URL or a case study URL of an AI project) <br \/>\n<br \/>\n**Apps** (web, tablet, mobile)<br \/>\n  <br \/>\n**AR** (submit a URL or a case study URL of an Augmented Reality project)<br \/>\n <br \/>\n**Installations** (submit a case study URL of a real world installation)<br \/>\n  <br \/>\n**Metaverse** (submit a URL or a case study URL of a Metaverse project)<br \/>\n <br \/>\n**NFT** (submit a URL or a case study URL of a NFT project)<br \/>\n <br \/>\n**VR** (submit a URL or a case study URL of a Virtual Reality project)<br \/>\n<br \/>\n**Websites** (desktop, tablet, mobile)<br \/>\n <br \/>\n**Other** (anything in the digital industry that is innovative... submit a case study URL)<br \/>\n<br \/>\nAfter submitting a project, it will enter the FWA project cycle that makes it instantly visible on the Live Judging page and a candidate to win a FOTD (FWA of the Day) based on the scores from our expert team of judges.<br \/>\n<br \/>\nFOTD winners enter the cycle for FOTM (FWA of the Month); FOTY & PCA (FWA of the Year & People's Choice Award).","outro":"**What happens now?**  <br \/>\nWe\u2019ve sent you a confirmation email.<br \/>\nYour project enters the FWA cycle. A 14 day period where the project has the chance to win a FOTD. To win, the project has to achieve the best score on our [Live Judging page](\/live-judging).<br \/>\n<br \/>\n[Follow your project in the live grid](\/live-judging)  <br \/>\n[See your project case](%case-link%)<br \/>\n<br \/>\nYour project enters the page with a base score of 50 pts. Reflecting our jury\u2019s votes the score will change and your project will move up or down the page. You can follow this at any time during the 14 days.<br \/>\n<br \/>\nEveryday at midnight (GMT) the best scoring project with at least 70 points and at least 20 judge's scores wins the FOTD.","extraVisualTitle":"We\u2019ve introduced a way to add extra visual assets and descriptions to your projects. You can add static images (jpg\/png) or animations (MP4)","extraVisual":"The visuals will be displayed on the project\u2019s case page in a grid of the extra visuals you may have added. NOTE: 20mb max for MP4s<br \/>\n<br \/>\n[See an example of case extras](\/cases\/falter-inferno#case-extras)  <br \/>\n  <br \/>\n[See an example of animated case extras](\/cases\/virtual-art-sessions#case-extras)","thumbnailHelpText":"The thumbnail will be used when the projects appears in grids and other overviews on the site. TIP, use the same image (different size) as the first project slide, below.<br \/>\n[See example of thumbnail in use](\/cases\/a-bears-eye-view-of-yellowstone#related-cases)","slidesHelpText":"The slides are the main visual assets for a case.  <br \/>\n[See example of slides in use](\/)","startButton":"Submit to FWA","startText":"Submit to FWA:","startTextPrice":"\u00a370.50 GBP","continueUsingCC":"Next, you complete payment.","addProfilePopup":"**%name%**<br \/>\n<br \/>\nDoes not have a profile on The FWA. <br \/>\nDo you want to create one and become the administrator?","addCreditPopup":"**%name%** is about to be added as a credit.<br \/>\n<br \/>\nA credit is like a profile, but without most of the benefits of an actual profile.<br \/>\n<br \/>\n(A credit can later be claimed and become a full FWA profile.)"},"jobcreate":{"startButton":"Post job vacancy","startText":"Post job vacancy for 90 days on FWA:","startTextPrice":"\u00a370.50 GBP","intro":"**Post jobs where people are looking**  <br \/>\n<br \/>\nFWA is where you go to experience cutting-edge innovation in digital design and development. It\u2019s a space that encourages the digital industry to push the boundaries of technology, to show people what is possible.","outro":"**What happens now?**  <br \/>\nWe\u2019ve sent you a confirmation email.<br \/>\n<br \/>\nYour job has been posted on the FWA.  <br \/>\n[Promote job posting](%job-link%).","continueUsingCC":"Next, you complete payment.","addProfilePopup":"**%name%**<br \/>\n<br \/>\nDoes not have a profile on The FWA. <br \/>\nDo you want to create one and become the administrator?"}},"livejudging":{"step1Title":"In June 2016 we introduced a new FWA Judging system","step1Text":"Now you can follow the projects live in judging.","step2Title":"Only one daily award","step2Text":"All previous \u201cOf The Day\u201d awards are now gathered in one \u2013 the FOTD (FWA Of The Day).<br \/>\n<br \/>\nEach project will, of course, be judged on the device it works the best on.","step3Title":"From 0-100 points","step3Text":"The new system will give an actual score, based on the average scores of judges who have voted so far.","step4Title":"Everyone enters at 50","step4Text":"Each project submitted will enter at 50 and will then move up or down, depending on the judges\u2019 votes. The initial 50 is an entry point, not an actual score.","step5Title":"20 votes minimum.","step5Text":"To win an FOTD, a minimum score of 70 is required and at least 20 judges must have given their vote to the project.<br \/>\n<br \/>\nAt midnight GMT each day, the project with the highest score (70 minimum and at least 20 votes) becomes the new FOTD.","step6Title":"14 days chance of winning","step6Text":"Each project will stay in live judging for a maximum of 14 days. <br \/>\n<br \/>\nIf the project didn\u2019t win an FOTD by the end of the \u000314th day, it will be removed from the judging system.","step7Title1":"FWA of the Month (FOTM)","step7Text1":"5 days before the end of each month, FOTM will be decided by taking the 5 highest scoring projects and the judging team will each pick one winner. The project with the most votes will become the FOTM.","step7Title2":"FWA of the Year (FOTY)","step7Text2":"will be decided by taking the 12 FOTM winners and the FOTY judging team will each pick one winner. The project with the most votes will become the FOTY, announced in January each year.","step7Title3":"FWA People's Choice Award (PCA)","step7Text3":"will be decided by taking the 12 FOTM winners and the public will each pick one winner. The project with the most votes will become the PCA, announced in January each year."},"jury":{"jurySearch":"Search for name or location"},"contextual":{"caseSearch":"Search for titles, agencies or locations","editorialSearch":"Search for name, agency etc.","profilesSearch":"Search for agency or location","jobsSearch":"Search for roles, agency or location"},"socialshare":{"facebook":"Facebook","twitter":"Twitter","gplus":"Google+","linkedin":"LinkedIn","email":"email","hashtag":"thefwa"},"error404":{"title":"404 - Page not found","text":"The page could not be found."},"editorials":{"editorialsCopyright":"(This editorial piece may not be reproduced or used in any part without the prior written consent of the author. Reprints must credit FWA (theFWA.com) as the original publisher of this editorial piece and include a link to this site)."},"jobs":{"jobsCopyright":"(The above job is not related to FWA. This is purely an electronic advertising service provided by FWA. FWA does not represent nor make any warranty in respect of the accuracy, reliability or continuous supply of the information on the FWA website\/domain.)"},"tceay":{"blurb":"TCEAY Shortlist","head":"The Cutting Edge Project of the Year","subhead":"Once a year Adobe presents the Cutting Edge award, \u0003Project of the Year to the project that best highlights the newest capabilities of the modern web.","about":"A public vote determines the overall winner \u0003of the previous 52 Cutting Edge Project of the Week winners. After the first week of voting, the shortlist is reduced to 12 projects, and then a further two week voting period between the 12 finalists will determine the winner.<br \/>\n<br \/>\nYou can vote only once for each stage of the process \u0003(i.e. once per round of voting). Unique votes are counted whilst duplicates are discarded.","confirm":"You are about to vote for \"**%title%**\", is this correct?"},"pca":{"blurb":"PCA Shortlist","head":"The FWA People\u2019s Choice Award (PCA)","subhead":"First introduced in 2002, is a yearly award and is highly coveted by agencies and brands as this award is decided by FWA's long established audience.","about":"FWA\u2019s visitors choose the PCA winner by participating in a public vote (early January), with each visitor able to cast a single vote.<br \/>\n<br \/>\nThe 12 finalists are the 12 FWA's of the Month (FOTM) for the given year.<br \/>\n<br \/>\nThe FOTM with the highest number of votes after a 10 day period of voting is declared the People\u2019s Choice for the given year.<br \/>\n<br \/>\nYou need to have an FWA user account to vote (it only takes a second to create one):<br \/>\n<br \/>\nhttps:\/\/thefwa.com\/account\/register\/<br \/>\n<br \/>\nYou need to be signed in to cast your vote, which you can do here:<br \/>\n<br \/>\nhttps:\/\/thefwa.com\/account\/login\/<br \/>\n<br \/>\nSee the 12 finalists and vote for your favourite below.","confirm":"You are about to vote for \"**%title%**\", is this correct?"}}
